<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved preference before styles can paint.
      let preference
      let accent
      try {
        preference = localStorage.getItem('godesk-theme')
        accent = localStorage.getItem('godesk-accent')
      } catch {
        // Storage can be unavailable in restricted browser contexts.
      }
      const explicit = preference === 'light' || preference === 'dark'
      document.documentElement.dataset.themePreference = explicit ? preference : 'system'
      document.documentElement.dataset.theme = explicit
        ? preference
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      document.documentElement.dataset.accent = ['blue', 'iris', 'teal', 'amber', 'rose'].includes(accent)
        ? accent
        : 'blue'
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="goDesk Web 桌面" />
    <title>goDesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
